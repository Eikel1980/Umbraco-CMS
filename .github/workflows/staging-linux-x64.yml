name: Build staging Linux x64 package
on:
  push:
    branches: [deployment/linux-x64-staging]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit SHA to package (defaults to the commit this run was started from)
        required: false
permissions:
  contents: read
  statuses: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Package the commit this run is for, so a merged fix cannot be left out of the build.
      SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Link build to deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=staging-package -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Name the package after the source commit
        run: echo "PACKAGE=umbraco-${SOURCE_COMMIT::12}-linux-x64" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/Umbraco.Web.UI.Client/.nvmrc
      - name: Publish pinned self-contained build
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          dotnet publish src/Umbraco.Web.UI/Umbraco.Web.UI.csproj -c Release -r linux-x64 --self-contained true -m:1 -o "$RUNNER_TEMP/publish" -v:q
      - name: Verify and archive release
        working-directory: ${{ runner.temp }}/publish
        run: |
          set -eu
          test -x Umbraco.Web.UI
          for file in libhostfxr.so libcoreclr.so Umbraco.Cms.Persistence.MariaDb.dll Umbraco.Cms.Persistence.EFCore.MariaDb.dll wwwroot/umbraco/backoffice/umbraco-package.json wwwroot/umbraco/login/login.js; do test -s "$file"; done
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT
          tar -czf "$RUNNER_TEMP/$PACKAGE.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum "$PACKAGE.tar.gz" | tee "$PACKAGE.sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE }}.tar.gz
            ${{ runner.temp }}/${{ env.PACKAGE }}.sha256
          compression-level: 0
          retention-days: 7
      - name: Report package result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=staging-package -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
